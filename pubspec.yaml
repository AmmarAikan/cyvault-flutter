name: cyvault
description: CyVault is an offline-first encrypted password vault and security learning app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: 2.9.0
  cupertino_icons: 2.0.0
  drift: 2.35.3
  # 2.x targets the separate material_ui package; 1.9 is the current
  # flutter/material-compatible line for this verified Flutter toolchain.
  dynamic_color: 1.9.0
  file_picker: 13.3.0
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  go_router: 18.1.1
  http: 1.6.0
  intl: 0.20.3
  local_auth: 3.0.2
  path: 1.9.1
  path_provider: 2.1.6
  pdf: 3.13.1
  printing: 5.15.1
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  uuid: 4.6.0

dev_dependencies:
  build_runner: 2.17.1
  drift_dev: 2.35.2
  fake_async: 1.3.3
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: 1.0.5
  sqlite3: 3.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
